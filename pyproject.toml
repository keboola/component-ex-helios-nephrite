[project]
name = "helios-nephrite"
dynamic = ["version"]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "backoff>=2.2.1",
    "keboola-component>=1.6.10",
    "keboola-csvwriter>=1.0.1",
    "keboola-utils>=1.1.0",
    "pydantic>=2.11.3",
    "pyrate-limiter>=3.0.0",
    "requests>=2.31.0",
]

[dependency-groups]
dev = [
    "ruff>=0.15.0",
    "mock",
    "freezegun",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
extend-select = ["I", "UP"]  # Add isort to default ruff rules
